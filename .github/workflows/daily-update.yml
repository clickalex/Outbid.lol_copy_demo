name: Daily market refresh

# The bot that keeps this report current.
#
#   1. Fetches the public outoutbid.lol directory API (CC BY 4.0).
#   2. Rewrites data/outbid-market-inventory.csv and data/stats.json.
#   3. Re-checks outbid.lol routes + About counters and refreshes every
#      bot-managed figure in index.html.
#   4. Commits and pushes when anything changed.
#
# ACTIVATION: copy this file to .github/workflows/daily-update.yml
# (commit it from an account with workflow permissions — e.g. the GitHub
# web UI: Add file → Create new file). GitHub only fires `schedule` from
# the default branch; until then use workflow_dispatch (Actions tab →
# “Daily market refresh” → Run workflow) to run it on any branch.

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh CSV and report figures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run update bot
        run: python scripts/update_report.py

      - name: Commit and push if anything changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "outbid-market-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/outbid-market-inventory.csv data/stats.json index.html
          if git diff --cached --quiet; then
            echo "No changes to commit — data identical to the last run."
            exit 0
          fi
          git commit -m "bot: daily market refresh ($(date -u +%F)) [skip ci]"
          git push origin "HEAD:$BRANCH"
